        };

        const colorKeys = Object.keys(colorMap);
        
        // 과목명에서 분반(A, B, 1, 2)이나 괄호(Dream 등)를 완벽하게 제거하여 같은 그룹으로 묶는 함수
        function getBaseSubjectName(subject) {
            return subject.replace(/\s*\([^)]*\)/g, '') // 괄호와 그 안의 내용 제거 (예: (Dream))
                          .replace(/\s*[A-Za-z0-9]+$/g, '') // 끝에 붙은 알파벳이나 숫자 제거 (예: A, 1)
                          .trim() || subject; // 다 지워지면 원본 유지
        }

        // 과목명에 따라 고유한 색상을 일관되게 부여하는 함수
        function getColorForSubject(subject) {
            let hash = 0;
            const pureSubject = getBaseSubjectName(subject);
            for (let i = 0; i < pureSubject.length; i++) {
                hash = pureSubject.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colorKeys[Math.abs(hash) % colorKeys.length];
        }

        const lines = rawCSV.trim().split(/\r?\n/);

        lines.forEach(line => {

            const parts = line.split(',');
            if (parts.length < 5) return;
            
            const period = parts[0].trim();
            const subject = parts[1].trim();
            const daysStr = parts[2].trim();
            const time = parts[3].trim();
            const room = parts[4].trim();
            const color = getColorForSubject(subject);
            
            if(!periods.includes(period)) {
                periods.push(period);
            }
            
            // "화/목" 과 같은 데이터 분리 처리
            const daysArray = daysStr.split('/');
            daysArray.forEach(day => {
                classesData.push({
                    id: idCounter++,
                    period: period,
                    subject: subject,
                    day: day.trim(),
                    time: time,
                    room: room,
                    color: color,
                    ...commonData
                });
            });
        });

                                <h4 class="font-bold text-lg mb-2 tracking-tight text-gray-900">${cls.subject}</h4>
                                <div class="flex flex-col gap-1 text-xs text-gray-700 bg-white bg-opacity-50 p-2.5 rounded-lg border border-white">
                                    <div class="flex items-center gap-1.5"><i class="ph ph-map-pin-line text-lg"></i> ${cls.room}</div>
                                </div>
                            `;
                            
                            col.appendChild(card);
                        });
                    }
                    
                    container.appendChild(col);
                });
            }

            if (totalClassesShown === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-20 flex flex-col items-center justify-center text-center">
                        <div class="w-24 h-24 bg-white border border-gray-200 rounded-full flex items-center justify-center mb-4 shadow-sm">
                            <i class="ph ph-magnifying-glass text-4xl text-gray-400"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">검색 결과가 없습니다</h3>
                        <p class="text-gray-500 max-w-sm">
                            조건에 맞는 강좌가 없습니다. 다른 요일이나 검색어를 입력해 보세요.
                        </p>
                        <button onclick="document.getElementById('searchInput').value=''; searchQuery=''; setDay('전체');" class="mt-6 px-6 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium transition-colors shadow-sm">
                            필터 초기화
                        </button>
                    </div>
                `;
            }
        }

        // Modal Controls
        function openModal(cls) {
            document.getElementById('modalSubject').textContent = cls.subject;
            document.getElementById('modalTime').textContent = `${cls.day}요일 ${cls.time}`;
            document.getElementById('modalRoom').textContent = cls.room;
            document.getElementById('modalCapacity').textContent = `${cls.capacity}명 내외`;
            document.getElementById('modalDescription').textContent = cls.desc;
            
            document.getElementById('modalBadges').innerHTML = `
                <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-gray-100 text-gray-600">${cls.time}</span>
            `;

            if(modal) modal.classList.remove('hidden');
        }

        function closeModal() {
            if(modal) modal.classList.add('hidden');
        }

        function setupEventListeners() {
            if(closeModalBtn) closeModalBtn.addEventListener('click', closeModal);
            if(closeModalBtn2) closeModalBtn2.addEventListener('click', closeModal);
            
            if(modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal();
                });
            }

            if(helpBtn) {
                helpBtn.addEventListener('click', () => {
                    // iframe 보안 정책(sandbox)으로 인한 브라우저 기본 alert 창 차단을 방지하기 위해 커스텀 모달로 대체
                    document.getElementById('modalSubject').textContent = '안내사항';
                    document.getElementById('modalTime').textContent = '-';
                    document.getElementById('modalRoom').textContent = '-';
                    document.getElementById('modalCapacity').textContent = '-';
                    document.getElementById('modalDescription').textContent = '강좌 관련 세부 사항이나 수강 신청 방법은 각 학교 공지사항을 확인해 주세요.';
                    document.getElementById('modalBadges').innerHTML = '';
                    if(modal) modal.classList.remove('hidden');
                });
            }
            
            if(searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value.trim().toLowerCase();
                    renderSchedule();
                });
            }
        }

        // 아주 안전한 방식으로 초기화 스크립트 실행 (미리보기 화면 대응)
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
