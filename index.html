        const colorMap = {
            blue: 'bg-blue-50 text-blue-700 border-blue-200',
            green: 'bg-green-50 text-green-700 border-green-200',
            purple: 'bg-purple-50 text-purple-700 border-purple-200',
            pink: 'bg-pink-50 text-pink-700 border-pink-200',
            teal: 'bg-teal-50 text-teal-700 border-teal-200',
            rose: 'bg-rose-50 text-rose-700 border-rose-200',
            amber: 'bg-amber-50 text-amber-700 border-amber-200',
            indigo: 'bg-indigo-50 text-indigo-700 border-indigo-200',
            orange: 'bg-orange-50 text-orange-700 border-orange-200',
            cyan: 'bg-cyan-50 text-cyan-700 border-cyan-200',
            yellow: 'bg-yellow-50 text-yellow-700 border-yellow-200'
        };

        const colorKeys = Object.keys(colorMap);
        
        // 과목명에서 분반(A, B, 1, 2)이나 괄호(Dream 등)를 완벽하게 제거하여 같은 그룹으로 묶는 함수
        function getBaseSubjectName(subject) {
            // 컴퓨터 관련 과목명 예외 처리: 순수 과목명 그룹화 시에는 '컴퓨터'로 묶이도록 함
            if (['코딩', '꾸러기', '자격', '자격A', '자격B', '컴마스터', '컴박사'].includes(subject)) {
                return '컴퓨터';
            }
            return subject.replace(/\s*\([^)]*\)/g, '') // 괄호와 그 안의 내용 제거 (예: (Dream))
                          .replace(/\s*[A-Za-z0-9]+$/g, '') // 끝에 붙은 알파벳이나 숫자 제거 (예: A, 1)
                          .trim() || subject; // 다 지워지면 원본 유지
        }

        // 과목명에 따라 고유한 색상을 일관되게 부여하는 함수
        function getColorForSubject(subject) {
            let hash = 0;
            const pureSubject = getBaseSubjectName(subject);
            for (let i = 0; i < pureSubject.length; i++) {
                hash = pureSubject.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colorKeys[Math.abs(hash) % colorKeys.length];
        }

        // CSV Parser
        let classesData = [];
        let idCounter = 1;
        
        const lines = rawCSV.trim().split(/\r?\n/);
        lines.shift(); // 헤더 제거
        
        lines.forEach(line => {
            if (!line.trim()) return;
            const parts = line.split(',');
            if (parts.length < 4) return;
            
            const subject = parts[0].trim();
            const daysStr = parts[1].trim();
            const time = parts[2].trim();
            const room = parts[3].trim();
            const color = getColorForSubject(subject);
            
            // "화/목" 과 같은 데이터 분리 처리 (현재 데이터는 이미 분리되어 있으나 안전장치로 유지)
            const daysArray = daysStr.split('/');
            daysArray.forEach(day => {
                classesData.push({
                    id: idCounter++,
                    subject: subject,
                    day: day.trim(),
                    time: time,
                    room: room,
                    color: color
                });
            });
        });

            if (!dayContainer) return;
            
            const dayOptions = ['A', '월', '화', '수', '목', '금'];
            dayContainer.innerHTML = dayOptions.map(day => `

                    class="px-3 py-1.5 text-sm font-semibold rounded-lg transition-all border shadow-sm whitespace-nowrap ${
                        (currentDay === '전체' && day === 'A') || (currentDay === day)
                        ? 'bg-indigo-600 text-white border-indigo-600' 
                        : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50 hover:border-gray-300'
                    }">
                    ${day}
                </button>
            `).join('');
        }

        // Set State functions
        window.setDay = function(day) {
            currentDay = day;
            renderFilters();
            renderSchedule();
            
            // 요일 선택 시 화면의 가장 첫 줄(최상단)로 부드럽게 이동
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Render the main schedule grid
        function renderSchedule() {
            const container = document.getElementById('scheduleContainer');
            if (!container) return;
            
            container.innerHTML = '';

            let daysToRender = currentDay === '전체' ? days : [currentDay];
            let totalClassesShown = 0;

            if (daysToRender.length === 1) {
                // 1. 특정 요일 선택 시: 과목별로 그룹화하여 가로로 나열
                container.className = "flex flex-col gap-4 md:gap-6";
                const day = daysToRender[0];

                const dayClasses = classesData.filter(cls => {
                    const matchDay = cls.day === day;
                    const searchStr = searchQuery.toLowerCase();
                    const matchSearch = searchQuery === '' || 
                                        cls.subject.toLowerCase().includes(searchStr) || 
                                        cls.room.toLowerCase().includes(searchStr);
                    return matchDay && matchSearch;
                });

                totalClassesShown += dayClasses.length;

                if (dayClasses.length > 0) {
                    // 과목명 기준으로 그룹화
                    const grouped = {};
                    dayClasses.forEach(cls => {
                        let groupName = getBaseSubjectName(cls.subject);
                        if (!grouped[groupName]) grouped[groupName] = [];
                        grouped[groupName].push(cls);
                    });

                    // 과목별 행 생성
                    Object.keys(grouped).sort().forEach((subjectGroup, groupIndex) => {
                        const subjectClasses = grouped[subjectGroup];
                        
                        // ★ 같은 과목 그룹 내에서는 무조건 시간(time) 순으로만 정렬 ★
                        subjectClasses.sort((a, b) => a.time.localeCompare(b.time));

                        const section = document.createElement('div');
                        section.className = "bg-white p-3 md:p-5 rounded-2xl shadow-sm border border-gray-100 fade-in";
                        section.style.animationDelay = `${groupIndex * 0.05}s`;

                        const subjectHeader = document.createElement('h3');
                        subjectHeader.className = "text-lg font-bold text-gray-800 mb-3 md:mb-4 flex items-center gap-2 border-l-4 border-indigo-500 pl-3";
                        subjectHeader.textContent = subjectGroup;
                        section.appendChild(subjectHeader);

                        // 세로 나열을 위한 Flex 컨테이너 (모바일 친화적 리스트 형태)
                        const listContainer = document.createElement('div');
                        listContainer.className = "flex flex-col gap-2";

                        subjectClasses.forEach((cls) => {
                            const styleClass = colorMap[cls.color] || colorMap['blue'];
                            const item = document.createElement('div');
                            // 한 줄로 배치 (Flexbox)
                            item.className = `flex flex-col sm:flex-row sm:items-center justify-between border rounded-xl p-3 bg-white ${styleClass}`;
                            
                            item.innerHTML = `
                                <div class="flex items-center gap-3 w-full">
                                    <h4 class="font-bold text-base tracking-tight text-gray-900 w-24 shrink-0">${cls.subject}</h4>
                                    <div class="flex flex-wrap items-center gap-2 w-full justify-between sm:justify-start">
                                        <span class="inline-flex items-center gap-1 text-xs font-semibold bg-white bg-opacity-70 px-2 py-1 rounded text-gray-700 mix-blend-multiply border border-black border-opacity-10 whitespace-nowrap">
                                            <i class="ph ph-clock"></i> ${cls.time}
                                        </span>
                                        <span class="inline-flex items-center gap-1 text-xs text-gray-700 bg-white bg-opacity-50 px-2 py-1 rounded-lg border border-white whitespace-nowrap">
                                            <i class="ph ph-map-pin-line"></i> ${cls.room}
                                        </span>
                                    </div>
                                </div>
                            `;
                            
                            listContainer.appendChild(item);
                        });

                        section.appendChild(listContainer);
                        container.appendChild(section);
                    });
                }
            } else {
                // 2. 전체 요일 선택 시
                // 모바일 환경 최적화: 갭 축소
                container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 md:gap-6";

                daysToRender.forEach(day => {
                    const dayClasses = classesData.filter(cls => {
                        const matchDay = cls.day === day;
                        const searchStr = searchQuery.toLowerCase();
                        const matchSearch = searchQuery === '' || 
                                            cls.subject.toLowerCase().includes(searchStr) || 
                                            cls.room.toLowerCase().includes(searchStr);
                        return matchDay && matchSearch;
                    });

                    totalClassesShown += dayClasses.length;
                    
                    // 강좌명(가나다) 순으로 정렬 후, 같으면 시간순으로 정렬
                    dayClasses.sort((a, b) => {
                        const baseA = getBaseSubjectName(a.subject);
                        const baseB = getBaseSubjectName(b.subject);
                        
                        if (baseA === baseB) {
                            return a.time.localeCompare(b.time);
                        }
                        return baseA.localeCompare(baseB, 'ko');
                    });

                    const col = document.createElement('div');
                    col.className = 'flex flex-col gap-3';

                    const header = document.createElement('div');
                    header.className = 'flex items-center gap-2 pb-3 border-b border-gray-200 mb-1 sticky top-16 bg-[#f3f4f6] z-0 pt-2';
                    header.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold">
                            ${day}
                        </div>
                        <h3 class="font-bold text-gray-800 text-lg">${day}요일</h3>
                        <span class="ml-auto bg-gray-200 text-gray-600 text-xs py-1 px-2 rounded-full font-medium">${dayClasses.length}건</span>
                    `;
                    col.appendChild(header);

                    if (dayClasses.length === 0) {
                        col.innerHTML += `
                            <div class="bg-white border border-dashed border-gray-300 rounded-xl p-8 text-center text-gray-400 fade-in mt-2">
                                <i class="ph ph-folder-open text-3xl mb-2"></i>
                                <p class="text-sm">해당 조건의 강좌가 없습니다</p>
                            </div>
                        `;
                    } else {
                        dayClasses.forEach((cls, index) => {
                            const styleClass = colorMap[cls.color] || colorMap['blue'];
                            const card = document.createElement('div');
                            card.className = `border rounded-xl p-4 transition-all duration-200 shadow-sm fade-in bg-white ${styleClass}`;
                            card.style.animationDelay = `${(index % 10) * 0.05}s`;
                            
                            card.innerHTML = `
                                <div class="flex justify-between items-start mb-2">
                                    <span class="inline-flex items-center gap-1 text-xs font-bold bg-white bg-opacity-70 px-2 py-1 rounded text-gray-700 mix-blend-multiply border border-black border-opacity-10">
                                        <i class="ph ph-clock"></i> ${cls.time}
                                    </span>
                                </div>
                                <h4 class="font-bold text-lg mb-2 tracking-tight text-gray-900">${cls.subject}</h4>
                                <div class="flex flex-col gap-1 text-xs text-gray-700 bg-white bg-opacity-50 p-2.5 rounded-lg border border-white">
                                    <div class="flex items-center gap-1.5"><i class="ph ph-map-pin-line text-lg"></i> ${cls.room}</div>
                                </div>
                            `;
                            
                            col.appendChild(card);
                        });
                    }
                    
                    container.appendChild(col);
                });
            }

            if (totalClassesShown === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-20 flex flex-col items-center justify-center text-center">
                        <div class="w-24 h-24 bg-white border border-gray-200 rounded-full flex items-center justify-center mb-4 shadow-sm">
                            <i class="ph ph-magnifying-glass text-4xl text-gray-400"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">검색 결과가 없습니다</h3>
                        <p class="text-gray-500 max-w-sm mb-6">
                            '${searchQuery}'에 대한 조건에 맞는 강좌가 없습니다. 다른 요일이나 검색어를 입력해 보세요.
                        </p>
                        <button onclick="clearSearchAndReset()" class="px-6 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium transition-colors shadow-sm">
                            필터 초기화
                        </button>
                    </div>
                `;
            }
        }

        function clearSearchAndReset() {
            if(searchInputModal) searchInputModal.value = '';
            searchQuery = '';
            setDay('전체');
            closeSearch();
        }

        // Modal Controls
        function openSearch() {
            if(searchModal) {
                searchModal.classList.remove('hidden');
                // 약간의 딜레이를 주어 모달이 렌더링된 후 포커스가 가도록 함
                setTimeout(() => {
                    if(searchInputModal) searchInputModal.focus();
                }, 100);
            }
        }

        function closeSearch() {
            if(searchModal) searchModal.classList.add('hidden');
        }

        function applySearch() {
            if(searchInputModal) {
                searchQuery = searchInputModal.value.trim().toLowerCase();
            }
            renderSchedule();
            closeSearch();
        }

        function setupEventListeners() {
            // Search Modal Events
            if(openSearchBtn) openSearchBtn.addEventListener('click', openSearch);
            if(closeSearchBtn) closeSearchBtn.addEventListener('click', closeSearch);
            
            if(searchModal) {
                searchModal.addEventListener('click', (e) => {
                    if (e.target === searchModal) closeSearch();
                });
            }
            
            if(resetSearchBtn) {
                resetSearchBtn.addEventListener('click', () => {
                    if(searchInputModal) searchInputModal.value = '';
                    searchQuery = '';
                    renderSchedule();
                });
            }

            if(applySearchBtn) {
                applySearchBtn.addEventListener('click', applySearch);
            }

            // 엔터키 입력 시 검색 적용
            if(searchInputModal) {
                searchInputModal.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        applySearch();
                    }
                });
            }
        }

        // 아주 안전한 방식으로 초기화 스크립트 실행
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
